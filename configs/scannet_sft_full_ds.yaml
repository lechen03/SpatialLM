### model
model_name_or_path: manycore-research/SpatialLM1.1-Qwen-0.5B
trust_remote_code: true

### method
do_train: true
# 方案B：全量微调（点云塔 + 语言塔都不冻结），用 DeepSpeed ZeRO-2
# 把优化器状态和梯度分片到 4 张卡上，以适配单卡 24GB
freeze_language_tower: false
freeze_point_tower: false
train_proj_only: false

### deepspeed
deepspeed: configs/ds_zero2.json

### dataset
dataset: scannet_train
eval_dataset: scannet_val
dataset_dir: data/scannet_spatiallm
template: spatiallm_qwen
num_bins: 1280
do_augmentation: false
random_rotation: true
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 8
save_dir: saves/scannet_cache

### output
output_dir: /media/drive1_3TB/chenle/SpatialLM/saves/scannet_full
logging_steps: 10
save_steps: 500
overwrite_output_dir: false
save_total_limit: 5

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 10
lr_scheduler_type: cosine
warmup_ratio: 0.03
pure_bf16: false # 注意：pure_bf16 与 ZeRO-3 不兼容；这里保持 false，用 bf16 混合精度
bf16: true
fp16: false
tf32: true
ddp_timeout: 180000000
report_to: none
max_new_tokens: 4096

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
